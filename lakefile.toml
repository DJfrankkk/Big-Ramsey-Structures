name = "bigRamseyStructures"
version = "0.1.0"
defaultTargets = ["RamseyProofs"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fabf563a7c95a166b8d7b6efca11c8b4dc9d911f"

[[lean_lib]]
name = "RamseyProofs"
srcDir = "Ramsey_Problems"
roots = ["CombinedRamsey", "RelationalRamsey632", "Generic3Ramsey"]
globs = ["CombinedRamsey", "CombinedRamsey.+", "RelationalRamsey632.+", "Generic3Ramsey.+"]
